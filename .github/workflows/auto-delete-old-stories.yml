# Keeps the site from filling up: deletes stories older than the limit set in the admin panel
# (Settings → "पुरानी खबरें अपने-आप हटाएं"). Runs every night and whenever a story is published.
# Free: GitHub Actions minutes are free for public repositories and 2,000 minutes/month for private ones.
# (npm run new-client copies this file to .github/workflows/ in each client's package.)
name: Delete old stories

on:
  schedule:
    - cron: '30 20 * * *' # every night at 2:00 AM India time
  push:
    branches: [main]
    paths:
      - 'src/content/articles/**'
      - 'src/content/webstories/**'
      - 'src/data/settings.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: delete-old-stories
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Delete stories older than the limit
        run: node scripts/cleanup-old-stories.mjs
      - name: Save the change
        run: |
          if [ -z "$(git status --porcelain src/content)" ]; then
            echo "Nothing to delete."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content
          git commit -m "Auto-delete old stories"
          git pull --rebase
          git push
